# pyproject.toml — Learnyx v1.0
# Лінтер: Ruff | Форматер: Black
# Python 3.11+ | Django / Python Backend

# ───────────────────────────────────────────
# Ruff — лінтер
# ───────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 130

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*/migrations/*",   # автогенерований код Django
    "manage.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

ignore = [
    "E501",   # line too long — handled by formatter
    "B904",   # raise from err — style preference
    "E402",   # module import not at top — acceptable in settings
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["E501", "F841"]
"**/settings.py" = ["E402", "F811", "E501"]
"**/test_settings.py" = ["E402"]

# ───────────────────────────────────────────
# Black — форматер
# ───────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
)/
'''
